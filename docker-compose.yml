services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    mem_limit: ${CADDY_MEM_LIMIT:-256m}
    # 生产部署必须配置域名，由 Caddy 自动申请 HTTPS 证书。
    environment:
      DOMAIN: "${DOMAIN:?请设置解析到本服务器的 HTTPS 域名}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - digitalmate-caddy-data:/data
      - digitalmate-caddy-config:/config
    depends_on:
      web:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-768m}
    environment:
      POSTGRES_DB: digitalmate
      POSTGRES_USER: digitalmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digitalmate}
    # 仅绑定到宿主机回环地址，不向公网暴露 5432；本机调试仍可用 localhost:5432 连接
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - digitalmate-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digitalmate -d digitalmate"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        PREBUILT_CONSOLE: ${PREBUILT_CONSOLE:-0}
        NODE_HEAP_MB: ${NODE_HEAP_MB:-2048}
    restart: unless-stopped
    # 上限只用于兜住失控进程，让 OOM 只杀该杀的容器而不是拖垮整机。
    mem_limit: ${WEB_MEM_LIMIT:-1g}
    command: sh -c "npm run db:migrate && npm run db:seed && npm run start"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_URL: postgres://digitalmate:${POSTGRES_PASSWORD:-digitalmate}@postgres:5432/digitalmate
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_SECRET: "${APP_SECRET:?请设置至少32字节的高熵APP_SECRET}"
      CHANNEL_SECRETS_KEY: "${CHANNEL_SECRETS_KEY:?请设置独立的32字节base64渠道加密密钥}"
      BACKUP_ENCRYPTION_KEY: "${BACKUP_ENCRYPTION_KEY:-}"
      BACKUP_STORAGE_DIR: /app/data/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      TRUST_PROXY_HEADERS: "true"
      ADMIN_CONSOLE_ENABLED: ${ADMIN_CONSOLE_ENABLED:-0}
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:?请设置对应 DOMAIN 的 HTTPS 根地址}"
      KIE_AI_API_KEY: ${KIE_AI_API_KEY:-}
      KIE_AI_BASE_URL: ${KIE_AI_BASE_URL:-https://api.kie.ai}
      GEMINI_3_5_FLASH_ENDPOINT: ${GEMINI_3_5_FLASH_ENDPOINT:-/gemini-3-5-flash-openai/v1/chat/completions}
      MODEL_STUDIO_API_KEY: ${MODEL_STUDIO_API_KEY:-}
      MODEL_STUDIO_BASE_URL: ${MODEL_STUDIO_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      CLAUDE_MESSAGES_ENDPOINT: ${CLAUDE_MESSAGES_ENDPOINT:-/claude/v1/messages}
      ANTHROPIC_API_VERSION: ${ANTHROPIC_API_VERSION:-2023-06-01}
      LLM_MODEL_MAIN: ${LLM_MODEL_MAIN:-claude-opus-4-8}
      LLM_MODEL_LIGHT: ${LLM_MODEL_LIGHT:-gemini-3-5-flash-openai}
      LLM_MODEL_MAIN_FALLBACKS: ${LLM_MODEL_MAIN_FALLBACKS:-}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-duckduckgo}
      ALIYUN_IQS_API_KEY: ${ALIYUN_IQS_API_KEY:-}
      ALIYUN_IQS_BASE_URL: ${ALIYUN_IQS_BASE_URL:-https://cloud-iqs.aliyuncs.com}
      PROACTIVE_QUIET_START: ${PROACTIVE_QUIET_START:-23:00}
      PROACTIVE_QUIET_END: ${PROACTIVE_QUIET_END:-08:00}
      PROACTIVE_MAX_PER_DAY: ${PROACTIVE_MAX_PER_DAY:-3}
      ATTACHMENT_STORAGE_DIR: /app/data/attachments
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      DINGTALK_ROBOT_CODE: ${DINGTALK_ROBOT_CODE:-}
      CHANNEL_IMPORT_LEGACY_ENABLED: ${CHANNEL_IMPORT_LEGACY_ENABLED:-0}
      CHANNEL_NODE_ENROLLMENT_CA_PATH: ${CHANNEL_NODE_ENROLLMENT_CA_PATH:-}
      CHANNEL_NODE_ENROLLMENT_CA_KEY_PATH: ${CHANNEL_NODE_ENROLLMENT_CA_KEY_PATH:-}
      CHANNEL_NODE_SERVER_CA_PATH: ${CHANNEL_NODE_SERVER_CA_PATH:-}
    # 不再向宿主机暴露 3000，仅通过 Caddy(443) 对外，防止 HTTP 明文绕过
    expose:
      - "3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - digitalmate-attachments:/app/data/attachments
      - digitalmate-backups:/app/data/backups
      - digitalmate-matrix:/app/data/matrix
      - ${CHANNEL_NODE_ENROLLMENT_CA_DIR:-./data/channel-node-enrollment-ca}:/run/digitalmate/channel-node-enrollment-ca:ro
      - ${CHANNEL_NODE_SERVER_CA_DIR:-./data/channel-node-server-ca}:/run/digitalmate/channel-node-server-ca:ro
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    build:
      context: .
      args:
        PREBUILT_CONSOLE: ${PREBUILT_CONSOLE:-0}
        NODE_HEAP_MB: ${NODE_HEAP_MB:-2048}
    mem_limit: ${AGENT_MEM_LIMIT:-1g}
    command: sh -c "npm run agent"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_URL: postgres://digitalmate:${POSTGRES_PASSWORD:-digitalmate}@postgres:5432/digitalmate
      APP_SECRET: "${APP_SECRET:?请设置至少32字节的高熵APP_SECRET}"
      CHANNEL_SECRETS_KEY: "${CHANNEL_SECRETS_KEY:?请设置独立的32字节base64渠道加密密钥}"
      KIE_AI_API_KEY: ${KIE_AI_API_KEY:-}
      KIE_AI_BASE_URL: ${KIE_AI_BASE_URL:-https://api.kie.ai}
      GEMINI_3_5_FLASH_ENDPOINT: ${GEMINI_3_5_FLASH_ENDPOINT:-/gemini-3-5-flash-openai/v1/chat/completions}
      MODEL_STUDIO_API_KEY: ${MODEL_STUDIO_API_KEY:-}
      MODEL_STUDIO_BASE_URL: ${MODEL_STUDIO_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      CLAUDE_MESSAGES_ENDPOINT: ${CLAUDE_MESSAGES_ENDPOINT:-/claude/v1/messages}
      ANTHROPIC_API_VERSION: ${ANTHROPIC_API_VERSION:-2023-06-01}
      LLM_MODEL_MAIN: ${LLM_MODEL_MAIN:-claude-opus-4-8}
      LLM_MODEL_LIGHT: ${LLM_MODEL_LIGHT:-gemini-3-5-flash-openai}
      LLM_MODEL_MAIN_FALLBACKS: ${LLM_MODEL_MAIN_FALLBACKS:-}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-duckduckgo}
      ALIYUN_IQS_API_KEY: ${ALIYUN_IQS_API_KEY:-}
      ALIYUN_IQS_BASE_URL: ${ALIYUN_IQS_BASE_URL:-https://cloud-iqs.aliyuncs.com}
      PROACTIVE_QUIET_START: ${PROACTIVE_QUIET_START:-23:00}
      PROACTIVE_QUIET_END: ${PROACTIVE_QUIET_END:-08:00}
      PROACTIVE_MAX_PER_DAY: ${PROACTIVE_MAX_PER_DAY:-3}
      ATTACHMENT_STORAGE_DIR: /app/data/attachments
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      DINGTALK_ROBOT_CODE: ${DINGTALK_ROBOT_CODE:-}
      CHANNEL_IMPORT_LEGACY_ENABLED: ${CHANNEL_IMPORT_LEGACY_ENABLED:-0}
      CHANNEL_GATEWAY_PORT: 3101
      CHANNEL_NODE_PORT: 9443
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:?请设置对应 DOMAIN 的 HTTPS 根地址}"
      CHANNEL_NODE_TLS_CERT_PATH: ${CHANNEL_NODE_TLS_CERT_PATH:-}
      CHANNEL_NODE_TLS_KEY_PATH: ${CHANNEL_NODE_TLS_KEY_PATH:-}
      CHANNEL_NODE_CA_PATH: ${CHANNEL_NODE_CA_PATH:-}
    expose:
      - "3101"
    ports:
      - "${CHANNEL_NODE_PORT:-9443}:9443"
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - digitalmate-attachments:/app/data/attachments
      - digitalmate-matrix:/app/data/matrix
      - ${CHANNEL_NODE_TLS_DIR:-./data/channel-node-tls}:/run/digitalmate/channel-node-tls:ro
    restart: unless-stopped

volumes:
  digitalmate-postgres:
  digitalmate-caddy-data:
  digitalmate-caddy-config:
  digitalmate-attachments:
  digitalmate-backups:
  digitalmate-matrix:
